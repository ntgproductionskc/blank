[/Script/EnhancedInput.EnhancedInputProjectSettings]
DefaultMappingContexts=()

[/Script/Engine.InputSettings]
; All input handled via Enhanced Input — see BP_InputMappingContext assets
; Default key bindings documented here for reference:
;
; GAMEPLAY (Ground & Flight)
; W/A/S/D or Left Stick      — Move / Flight directional
; Mouse / Right Stick         — Look
; Space / Cross               — Jump / Start Flying
; Hold Space / Cross          — Sustained Flight
; Shift / R2                  — Flight Boost (Sonic Speed)
; Ctrl / Circle              — Land
;
; POWERS
; Left Mouse / R1             — Heat Vision (hold)
; Right Mouse / L1            — Freeze Breath (hold)
; Q / Square                  — Toggle Super Speed
; E / Triangle                — Toggle X-Ray Vision
; R / D-Pad Up                — Toggle Super Hearing
; F / L3                      — Grab / Interact
; G / R3                      — Throw Grabbed Object
;
; COMBAT
; Left Click / Square         — Light Attack
; Right Click / Triangle      — Heavy Attack
; Middle Mouse / Circle       — Dodge
;
; UI
; M / Options                 — Open World Map
; J / Touchpad               — Mission Journal
; Esc / Start                 — Pause Menu

bUseMouseForTouch=False
bEnableMouseSmoothing=True
MouseSensitivityX=1.0
MouseSensitivityY=1.0
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockAlways
